<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЯгаГенератор</title>
<!-- ЯгаГенератор для MAX, версия 1 -->
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
:root{--bg:#07030f;--card:#130a26;--cy:#22e1ff;--pk:#ff3fd0;--pu:#7a2cff;--tx:#f3eaff;--mut:#a99bc9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);background:radial-gradient(120% 50% at 50% -5%,#33106f,transparent 62%),radial-gradient(80% 40% at 100% 100%,#0a3a5a66,transparent 70%),var(--bg)}
.top{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:50%;border:2px solid var(--cy);box-shadow:0 0 14px var(--cy),0 0 26px #ff3fd055;object-fit:cover}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:20px;font-weight:900;background:linear-gradient(90deg,var(--cy),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #22e1ff77)}
.ttl i{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.bal{border:1px solid var(--pk);border-radius:14px;padding:7px 11px;font-weight:800;font-size:15px;box-shadow:0 0 12px #ff3fd066,inset 0 0 10px #ff3fd02a;white-space:nowrap;background:#1a0b30}
.tabs{display:flex;gap:8px;margin:16px 0 12px}
.tabs button{flex:1;padding:11px 0;border-radius:12px;border:1px solid #3a2a66;background:#120a24;color:var(--mut);font-weight:800;font-size:14px}
.tabs button.on{color:#fff;border-color:var(--cy);background:linear-gradient(135deg,#1b0d3d,#2a0f5e);box-shadow:0 0 14px #22e1ff66}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{position:relative;background:var(--card);border:1px solid #31205a;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 #0000;transition:.2s}
.card:active{transform:scale(.97);border-color:var(--pk);box-shadow:0 0 16px #ff3fd077}
.pic{aspect-ratio:3/4;background:linear-gradient(135deg,#2a0f5e,#0c3a5c);display:flex;align-items:center;justify-content:center;font-size:42px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:9px 10px 11px}
.cb b{display:block;font-size:14px;line-height:1.2;margin-bottom:5px}
.cb span{font-size:13px;font-weight:800;color:var(--cy)}
.cb em{font-style:normal;font-size:11px;color:var(--mut);float:right}
.hot{position:absolute;top:8px;left:8px;background:linear-gradient(90deg,var(--pk),var(--pu));font-size:11px;font-weight:800;padding:3px 8px;border-radius:9px;box-shadow:0 0 10px var(--pk)}
.pic video{width:100%;height:100%;object-fit:cover;display:block}
.vid{position:absolute;top:8px;right:8px;background:#000b;border:1px solid var(--cy);color:var(--cy);font-size:11px;font-weight:800;padding:3px 8px;border-radius:9px;box-shadow:0 0 8px var(--cy);z-index:1}
.empty{grid-column:1/3;text-align:center;color:var(--mut);padding:40px 0}
.sh{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:5}
.sh.on{display:flex}
.pn{width:100%;max-height:92vh;overflow:auto;background:#0e0620;border:1px solid var(--pu);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -6px 30px #7a2cff66}
.pn h2{margin:0 0 4px;font-size:20px}
.pn p{margin:0 0 14px;color:var(--mut);font-size:13px}
.up{display:block;border:2px dashed var(--cy);border-radius:16px;padding:18px;text-align:center;color:var(--cy);font-weight:800;margin-bottom:14px;background:#22e1ff0d}
.up img{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:0 auto 8px}
.go{width:100%;padding:15px;border:0;border-radius:15px;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--pu),var(--pk));box-shadow:0 0 20px #ff3fd099}
.go:disabled{opacity:.5}
.x{background:none;border:0;color:var(--mut);width:100%;padding:12px;font-size:14px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:#1a0b30;border:1px solid var(--cy);border-radius:14px;padding:13px;text-align:center;font-size:14px;box-shadow:0 0 18px #22e1ff77;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1}
.hero{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border:1px solid #31205a;border-radius:16px;background:linear-gradient(135deg,#1b0d3d,#0c2a4a);box-shadow:0 0 18px #7a2cff44}
.hero img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 16px var(--cy),0 0 28px #ff3fd066}
.hero p{margin:0;font-size:13px;line-height:1.35;color:#e9dcff}

.q{display:block;margin:0 0 6px;font-size:13px;font-weight:700;color:var(--cy)}
.pn input,.pn select{width:100%;padding:13px;margin-bottom:13px;border-radius:12px;border:1px solid #3a2a66;background:#160b2c;color:var(--tx);font-size:16px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 10px #7a2cff55}50%{box-shadow:0 0 22px #22e1ff88,0 0 34px #ff3fd044}}
@keyframes shine{to{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.top,.hero,.tabs,.chips,.ttl2,.grid{position:relative;z-index:1}
.card{animation:up .5s both,glow 4s ease-in-out infinite;animation-delay:calc(var(--i,0)*70ms),calc(var(--i,0)*300ms)}
.card.vc{border-color:#ff3fd0aa}
.vid{animation:pulse 1.6s ease-in-out infinite}
.rank{position:absolute;top:8px;left:8px;z-index:1;background:linear-gradient(135deg,#ffd36e,#ff9ad9);color:#2a0f3d;font-weight:900;font-size:12px;padding:3px 9px;border-radius:9px;box-shadow:0 0 12px #ffd36e}
.ttl b{background:linear-gradient(90deg,var(--cy),var(--pk),#ffd36e,var(--cy));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.logo,.bal{animation:glow 3.2s ease-in-out infinite}
.chips{display:flex;gap:8px;margin:0 0 12px}
.chip{flex:1;padding:8px 0;border-radius:20px;border:1px solid #3a2a66;background:#120a24;color:var(--mut);font-weight:700;font-size:13px}
.chip.on{color:#fff;border-color:var(--pk);background:linear-gradient(135deg,#2a0f5e,#4a0f6e);box-shadow:0 0 12px #ff3fd066}
.ttl2{margin:2px 2px 10px;font-weight:800;font-size:15px;color:#ffe9a8;text-shadow:0 0 10px #ffd36e66}
.go{background:linear-gradient(90deg,var(--pu),var(--pk),var(--cy),var(--pu));background-size:200% 100%;animation:shine 4s linear infinite}
#pv img,#pv video{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:12px;box-shadow:0 0 20px #7a2cff88;display:block}
.mp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.th{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--cy);box-shadow:0 0 12px #22e1ff55}
.th img{width:100%;height:110px;object-fit:cover;display:block}
.th b{position:absolute;left:6px;top:6px;background:var(--pk);border-radius:8px;padding:1px 8px;font-size:12px}
.th i{position:absolute;right:6px;top:6px;background:#000a;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.add{border:2px dashed var(--cy);border-radius:14px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cy);font-weight:800;text-align:center;font-size:13px;gap:4px}
#mk textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #3a2a66;background:#160b2c;color:var(--tx);font-size:16px;margin-bottom:13px;font-family:inherit}
.mc{border:1px solid #3a2a66;border-radius:14px;padding:11px 12px;margin-bottom:9px;background:#130a26}
.mc.on{border-color:var(--cy);box-shadow:0 0 14px #22e1ff66}
.mc b{display:flex;justify-content:space-between;gap:8px}.mc b span{color:var(--cy);white-space:nowrap}
.mc small{display:block;color:var(--mut);margin-top:4px;line-height:1.35;font-size:12px}
.chips.w{flex-wrap:wrap}.chips.w .chip{flex:0 0 auto;padding:8px 14px}
body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;margin:0;padding:8px;gap:6px;background:#0e0620ee;border:1px solid #3a2a66;border-radius:26px;box-shadow:0 0 24px #7a2cff66;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs button{border-radius:20px;border:0;background:transparent}
.dl{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#3b2a00,#5a1b52);border:1px solid #ffd36e;box-shadow:0 0 22px #ffd36e66;animation:glow 3s ease-in-out infinite}
.dlt{flex:1;font-size:14px;line-height:1.35}.dlt small{display:block;color:#ffe9a8;margin-top:6px;font-size:12px}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:18px;height:18px;border-radius:50%;background:#ffffff22;border:1px solid #ffd36e88}
.dots i.on{background:radial-gradient(#fff6c8,#ffd36e);box-shadow:0 0 8px #ffd36e}
.dl button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;color:#2a0f3d;background:linear-gradient(90deg,#ffd36e,#ff9ad9);white-space:nowrap}
.dl button.pulse{animation:pulse 1.4s ease-in-out infinite}
#hs{position:relative;z-index:1}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x mandatory}
.hs .card{flex:0 0 150px;scroll-snap-align:start}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,#0d3b66,#4a0f6e);border:1px solid var(--cy);box-shadow:0 0 16px #22e1ff55;position:relative;z-index:1;font-size:13px;font-weight:700}
.ch b{background:linear-gradient(90deg,var(--cy),var(--pk));color:#07030f;padding:7px 14px;border-radius:12px;white-space:nowrap}
.cp{width:100%;margin-bottom:10px;padding:12px;border-radius:14px;border:1px solid var(--cy);background:#0c2540;color:var(--cy);font-weight:800;font-size:14px}
.tb{position:relative;z-index:1;margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid var(--pk);box-shadow:0 0 26px #ff3fd088;animation:glow 3s ease-in-out infinite;cursor:pointer;height:220px;background:#120a24}
.tb .pic{position:absolute;inset:0;aspect-ratio:auto;height:100%}.tb .pic img,.tb .pic video{height:100%}
.tb .sh2{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 14px;background:linear-gradient(0deg,#07030fee,transparent);z-index:1}
.tb b{font-size:19px;display:block}.tb span{display:inline-block;margin-top:8px;background:linear-gradient(90deg,var(--pk),var(--pu));padding:8px 16px;border-radius:14px;font-weight:900;font-size:13px;box-shadow:0 0 14px var(--pk)}
.tb .tag{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#ffd36e,#ff9ad9);color:#2a0f3d;font-weight:900;font-size:12px;padding:3px 10px;border-radius:9px;z-index:2;box-shadow:0 0 12px #ffd36e}
.mx{display:flex;align-items:center;gap:5px;width:max-content;margin-top:6px;padding:3px 10px;border-radius:12px;background:linear-gradient(135deg,#2d7bff,#8a3ffc);font-size:11px;font-weight:900;letter-spacing:.04em;box-shadow:0 0 12px #2d7bff88;text-transform:uppercase}
.pic{background:#0b0518}.pic img,.pic video{object-fit:contain;background:#0b0518}
#pv img,#pv video{max-height:62vh;object-fit:contain;background:#0b0518}
.tb{height:auto}

<script>
// ВСТАВЬТЕ адрес веб-приложения Apps Script (заканчивается на /exec). Пока пусто, показываются демо-данные.
const API_URL = "https://script.google.com/macros/s/AKfycbwperkpcgteJS8yYmTu3ZoVdkdcoqHYIbdUi6hwWKItiVFO702Mpknxr_K0G6-AVr-6/exec";

const BOT_LINK = "https://max.ru/se14387925_bot";
const CH_LINK = "https://max.ru/babkakondyter";

const tg = window.WebApp;
try { tg && tg.ready(); } catch (e) {}
const initData = (tg && tg.initData) || "";

const DEMO = { balance: 50, templates: [
  { id: "1", title: "Инфографика знака зодиака", type: "image", image: "", price: 9, fields: [{ key: "фото", type: "фото", label: "Ваше фото" }, { key: "имя", type: "текст", label: "Как вас зовут?" }, { key: "пол", type: "выбор", label: "Ваш пол", options: ["Мужской", "Женский"] }, { key: "рождение", type: "дата", label: "Дата рождения" }], trend: true, today: 14, week: 96 },
  { id: "2", title: "Я в роли богатыря", type: "image", image: "", price: 9, trend: true, today: 9, week: 71 },
  { id: "3", title: "Оживить фото", type: "video", image: "", price: 36, trend: false, today: 5, week: 40 },
  { id: "4", title: "Портрет в стиле неон", type: "image", image: "", price: 5, trend: false, today: 2, week: 18 }
]};

const FALLBACK_MODELS = [
  { id: "gpt", title: "GPT Image 2.5", price: 9, hint: "Универсальная модель: рисует с нуля и редактирует по фото. Качество, разрешение и режим выбираются ниже." },
  { id: "super", title: "GPT Image 2.5 Супер", price: 9, hint: "Лучшее качество и точность. Для картинок с надписями, инфографики, плакатов и сложных сцен." },
  { id: "standard", title: "GPT Image 2.5 Стандарт", price: 5, hint: "Быстро и недорого. Для набросков, идей и простых картинок." },
  { id: "nano2", title: "Nano Banana 2.1", price: 9, hint: "Хорошо сохраняет лицо и детали на фото. Для обработки фото: фон, одежда, образ." },
  { id: "nanopro", title: "Nano Banana Pro", price: 18, hint: "Максимальный реализм и детальность. Для портретов, студийных и рекламных фото." },
  { id: "seedream", title: "Seedream 5 Pro", price: 11, hint: "Яркие художественные картинки. Для иллюстраций, арта, постеров и обложек." }
];
let S = { balance: 0, templates: [], tab: "all", kind: "all", mk: { kind: "img", model: "gpt", g: { v: "sunburst", q: "medium", r: "2k", c: false }, photos: [], vids: [], auds: [], size: "1:1", dur: 6, res: "480p" }, models: [], vp: {}, daily: null, cat: "", cur: null, photo: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(body) {
  if (!API_URL) return null;
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
  try {
    const r = await fetch(API_URL, { method: "POST", signal: ac.signal, headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ initData: initData }, body)) });
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { return { ok: false, error: "Сервер вернул не тот ответ: " + txt.slice(0, 120) }; }
  } finally { clearTimeout(tm); }
}

function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200);
}

function tab(t) {
  S.tab = t;
  ["all", "hot", "mk"].forEach(x => { $("t-" + x).className = x === t ? "on" : ""; });
  const mk = t === "mk";
  $("mk").style.display = mk ? "block" : "none";
  $("grid").style.display = mk ? "none" : "";
  $("ttl2").style.display = mk ? "none" : "";
  $("hs").style.display = mk ? "none" : "";
  $("mine").style.display = mk ? "none" : "";
  $("tb").style.display = mk ? "none" : "";
  $("cats").style.display = mk ? "none" : "";
  document.querySelector(".chips").style.display = mk ? "none" : "flex";
  if (mk) mkDraw(); else draw();
}

const isV = t => t.type === "video" || t.type === "chain";
function kind(k) {
  S.kind = k;
  ["all", "img", "vid"].forEach(x => { $("k-" + x).className = "chip" + (x === k ? " on" : ""); });
  draw();
}
function media(t, still) {
  if (t.video && !(still && t.image)) return '<video data-src="' + esc(t.video) + '"' + (t.image ? ' poster="' + esc(t.image) + '"' : "") + ' muted loop playsinline preload="none"></video>';
  return t.image ? '<img src="' + esc(t.image) + '" loading="lazy" decoding="async" onerror="this.remove()">' : (isV(t) ? "🎬" : "🪄");
}
// видео подгружается и играет только пока видно на экране (экономит трафик и ускоряет загрузку)
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) {
    if (!v.getAttribute("src")) { v.src = v.dataset.src; v.onerror = () => { v.removeAttribute("src"); v.load(); }; }
    v.play().catch(() => {});
  } else v.pause();
}), { threshold: 0.4 }) : null;
function lazyVideos() {
  document.querySelectorAll("video[data-src]").forEach(v => {
    if (io) io.observe(v); else if (!v.getAttribute("src")) { v.src = v.dataset.src; v.play().catch(() => {}); }
  });
}
// ---------- избранное и недавнее (хранится на телефоне) ----------
let FAV = [], REC = [];
try { FAV = JSON.parse(localStorage.getItem("yg_fav") || "[]"); REC = JSON.parse(localStorage.getItem("yg_rec") || "[]"); } catch (e) {}
function favSave() { try { localStorage.setItem("yg_fav", JSON.stringify(FAV)); localStorage.setItem("yg_rec", JSON.stringify(REC)); } catch (e) {} }
function favLabel() { const b = document.getElementById("favB"); if (b && S.cur) b.textContent = FAV.indexOf(S.cur.id) >= 0 ? "♥ В избранном (нажмите, чтобы убрать)" : "♡ Добавить в избранное"; }
function favToggle(id, ev) {
  if (ev) ev.stopPropagation();
  const i = FAV.indexOf(id);
  if (i >= 0) FAV.splice(i, 1); else FAV.unshift(id);
  favSave(); favLabel(); draw();
}
function recAdd(id) { REC = [id].concat(REC.filter(x => x !== id)).slice(0, 20); favSave(); }

function cardHtml(t, i, rank, still) {
  return '<div class="card' + (isV(t) ? " vc" : "") + '" style="--i:' + i + '" onclick="openP(\'' + esc(t.id) + '\')">' +
    (rank ? '<div class="rank">#' + rank + "</div>" : (t.trend ? '<div class="hot">🔥 в тренде</div>' : "")) +
    '<i class="fv' + (FAV.indexOf(t.id) >= 0 ? " on" : "") + '" onclick="favToggle(\'' + esc(t.id) + '\',event)">' + (FAV.indexOf(t.id) >= 0 ? "♥" : "♡") + "</i>" +
    (isV(t) ? '<div class="vid">▶ ВИДЕО</div>' : "") +
    '<div class="pic">' + media(t, still) + "</div>" +
    '<div class="cb"><b>' + esc(t.title) + "</b><span>" + esc(t.price) + " ₽</span>" + (t.week ? "<em>" + esc(t.week) + " за нед.</em>" : "") + "</div></div>";
}
function draw() {
  $("bal").textContent = S.balance + " ₽";
  const byHot = (a, b) => (b.week - a.week) || (b.today - a.today);
  const hot = S.templates.filter(t => t.trend || t.week > 0).sort(byHot).slice(0, 6);
  $("hs").innerHTML = (S.tab === "all" && S.kind === "all" && !S.cat && hot.length) ? '<div class="ttl2">🔥 Сейчас популярно</div><div class="hs">' + hot.map((t, i) => cardHtml(t, i, i + 1, true)).join("") + "</div>" : "";
  const mineIds = FAV.concat(REC.filter(x => FAV.indexOf(x) < 0)), mineList = mineIds.map(id => S.templates.find(t => t.id === id)).filter(Boolean).slice(0, 10);
  const showTop = S.tab === "all" && S.kind === "all" && !S.cat, newList = S.templates.length > 8 ? S.templates.slice(-6).reverse() : [];
  $("mine").innerHTML = (showTop && newList.length ? '<div class="ttl2">🆕 Новинки</div><div class="hs">' + newList.map((t, i) => cardHtml(t, i, 0, true)).join("") + "</div>" : "") +
    (showTop && mineList.length ? '<div class="ttl2">⭐ Моё: избранное и недавнее</div><div class="hs">' + mineList.map((t, i) => cardHtml(t, i, 0, true)).join("") + "</div>" : "");
  let list = S.templates.slice();
  if (S.kind === "img") list = list.filter(t => !isV(t));
  if (S.kind === "vid") list = list.filter(isV);
  if (S.cat) list = list.filter(t => (t.cats || []).indexOf(S.cat) >= 0);

const vidDur = f => new Promise(ok => {

});
async function sdAddV(e) {

function sdAddA(e) {

async function upFile(file, ext, onp) {
  const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8), CH = 2097152, n = Math.max(1, Math.ceil(file.size / CH));
  let url = "";
  for (let i = 0; i < n; i++) {
    const part = file.slice(i * CH, Math.min(file.size, (i + 1) * CH));
    const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",").pop()); r.onerror = no; r.readAsDataURL(part); });
    let r = null;
    for (let t = 0; t < 3 && !(r && r.ok); t++) { try { r = await api({ action: "up", uid: uid, i: i, n: n, size: file.size, start: i * CH, ext: ext, data: b64 }); } catch (e) { r = null; } }
    if (!r || !r.ok) throw new Error((r && r.error) || "Не удалось загрузить файл");
    if (r.url) url = r.url;
    onp(Math.round((i + 1) / n * 100));
  }
  if (!url) throw new Error("Файл не загрузился до конца");
  return url;
}

  const m = S.mk, prompt = $("mkp").value.trim(), price = mkPrice();
  if (prompt.length < 3) { toast("Опишите, что нужно сделать ✍️"); return; }
  if (m.kind === "vid" && !m.photos.length) { toast("Для видео добавьте фото 📷"); return; }
  if (m.kind === "sd" && !m.photos.length && !m.vids.length && !m.auds.length) { toast("Добавьте фото, видео или аудио 📎"); return; }
  if (S.balance < price) { toast("Недостаточно средств. Пополните баланс в чате с ботом 💳"); return; }
  $("mgo").disabled = true; $("mgo").textContent = "Запускаем…";
  try {
    let vids = [], auds = [];
    if (m.kind === "sd") {
      for (let k = 0; k < m.vids.length; k++) { const it = m.vids[k]; vids.push({ url: await upFile(it.file, it.ext, p => { $("mgo").textContent = "Загружаем видео " + (k + 1) + ": " + p + "%"; }), dur: it.dur }); }
      for (let k = 0; k < m.auds.length; k++) { const it = m.auds[k]; auds.push(await upFile(it.file, it.ext, p => { $("mgo").textContent = "Загружаем аудио " + (k + 1) + ": " + p + "%"; })); }
      $("mgo").textContent = "Запускаем…";
    }
    const r = await api({ action: "create", vids: vids, auds: auds, kind: m.kind, model: m.model, prompt: prompt, size: m.size, dur: m.dur, res: m.res, gv: m.g.v, gq: m.g.q, gr: m.g.r, gc: m.g.c, photos: m.photos });
    if (r === null) toast("Демо-режим: подключите API_URL");
    else if (r.ok) {
      if (typeof r.balance === "number") S.balance = r.balance;
      $("bal").textContent = S.balance + " ₽"; $("mkp").value = ""; m.photos = []; m.vids = []; m.auds = []; mkDraw();
      toast(r.message || "Готово! Результат придёт в чат с ботом 🍓"); return;
    } else toast(r.error || "Ошибка, попробуйте ещё раз");
  } catch (e) { toast("Нет связи, попробуйте ещё раз"); }
  $("mgo").disabled = false; $("mgo").textContent = "Сгенерировать за " + price + " ₽";
}

// светящиеся огоньки на фоне: золотые, светло-розовые, светло-бирюзовые
(function () {
  const c = $("fx"), g = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cols = ["255,211,110", "255,194,236", "143,245,255"];
  let W, H;
  const P = [];
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for (let i = 0; i < 46; i++) P.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.6, s: 0.02 + Math.random() * 0.06, a: Math.random() * 6.28, c: cols[i % 3] });
  (function loop(t) {
    g.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.y -= p.s / 60; p.x += Math.sin(t / 2500 + p.a) / 3000;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t / 900 + p.a)), x = p.x * W, y = p.y * H;
      const gr = g.createRadialGradient(x, y, 0, x, y, p.r * 5);
      gr.addColorStop(0, "rgba(" + p.c + "," + tw + ")"); gr.addColorStop(1, "rgba(" + p.c + ",0)");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, p.r * 5, 0, 6.28); g.fill();
    });
    requestAnimationFrame(loop);
  })(0);
})();

(async function init() {
  let d = null, err = "";
  try { d = await api({ action: "init" }); }
  catch (e) { err = e && e.name === "AbortError" ? "сервер долго не отвечает" : "нет связи с сервером"; }
  if (d === null && !err) d = DEMO;   // API_URL не вписан: показываем демо
  if (!d || !d.ok) {
    $("bal").textContent = "— ₽";
    $("dl").innerHTML = '<div class="dl">⚠️ ' + esc(err || (d && d.error) || "неизвестная ошибка") + "</div>"; S.models = FALLBACK_MODELS;
    $("grid").innerHTML = '<div class="empty">⚠️ ' + esc(err || (d && d.error) || "неизвестная ошибка") + "</div>";
    return;
  }
  S.balance = Number(d.balance) || 0; S.templates = d.templates || []; S.models = d.models || []; S.vinfo = d.videoInfo || null; S.vp = d.videoPrices || { "480p": 6, "720p": 12 }; S.daily = d.daily || null; dailyDraw(); tbDraw(); catsDraw(); if (!S.models.length) S.models = FALLBACK_MODELS;
  draw();
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  if (/^t/.test(sp) && S.templates.find(x => x.id === sp.slice(1))) openP(sp.slice(1));   // ссылка прямо на шаблон
})();
